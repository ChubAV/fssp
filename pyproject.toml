[project]
name = "fssp"
version = "0.1.0"
description = "Микросервис для работы с сайтом ФССП"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "2captcha-python>=2.0.2",
    "aiosqlite>=0.20.0",
    "beautifulsoup4>=4.14.3",
    "fastapi[standard]>=0.124.0",
    "lxml>=6.0.2",
    "mcp[cli]>=1.0.0",
    "playwright>=1.56.0",
    "pydantic-settings>=2.12.0",
    "rich>=14.2.0",
    "structlog>=25.5.0",
    "typer>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM"]
ignore = ["E501"]  # Игнорируем ошибки длины строки, т.к. используем line-length

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
